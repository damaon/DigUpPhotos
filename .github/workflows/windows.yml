# The core, the readers, llama.cpp's runtime and the CLI (with `digup serve`) build and pass their tests on Windows
# (docs/ARCHITECTURE.md). The model isn't downloaded here, so the reference-vector test is skipped.
name: Windows

on:
  push:
    branches: [main, windows]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: ffmpeg (sound, video, WebP, HEIC)
        run: choco install ffmpeg --no-progress -y > /dev/null
      # Each step's errors also become annotations, which the checks API shows without signing in.
      - name: SQLite, ONNX Runtime and the face models, llama.cpp
        run: |
          set -o pipefail
          (scripts/build-sqlite.sh && scripts/build-onnx.sh && scripts/build-llama.sh) 2>&1 | tee native.log \
            || { tail -40 native.log | sed 's/^/::error::/'; exit 1; }
      - name: Build
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee build.log \
            || { grep -E "error:|undefined|unresolved|LINK :|lld-link" build.log | sort -u | head -60 | sed 's/^/::error::/'; exit 1; }
      - name: Test
        run: |
          set -o pipefail
          cp Vendor/onnxruntime/lib/*.dll "$(swift build --show-bin-path)/"
          swift test --skip-build 2>&1 | tee test.log \
            || { grep -E "✘|error|Fatal|crash" test.log | head -60 | sed 's/^/::error::/'; tail -15 test.log | sed 's/^/::error::/'; exit 1; }
      # What a Windows user installs: the program (Swift's runtime linked in), ONNX Runtime and install.ps1.
      - name: Package
        run: |
          set -o pipefail
          swift build -c release --product digup --static-swift-stdlib 2>&1 | tee release.log \
            || { grep -E "error:|LINK|lld-link" release.log | sort -u | head -40 | sed 's/^/::error::/'; exit 1; }
          mkdir -p DigUp
          cp "$(swift build -c release --show-bin-path)/digup.exe" Vendor/onnxruntime/lib/onnxruntime.dll \
            packaging/windows/install.ps1 packaging/windows/digup.ico DigUp/
          DigUp/digup.exe --help | head -1
      - name: digup serve, as it runs
        run: |
          mkdir -p smoke && cp Tests/DigUpCoreTests/Fixtures/sample.docx smoke/
          ffmpeg -v error -f lavfi -i testsrc=size=640x480 -frames:v 1 smoke/photo.jpg
          python scripts/serve-smoke.py DigUp/digup.exe smoke 2>&1 | tee smoke.log \
            || { tail -30 smoke.log | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DigUp-windows-x64
          path: DigUp/
