# The core and llama.cpp's runtime build and pass their tests on Linux (docs/ARCHITECTURE.md). scripts/linux-test.sh
# does the same locally. The model isn't downloaded here, so the reference-vector test is skipped.
name: Linux

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Packages
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev libheif-dev libheif-plugin-libde265 ffmpeg poppler-utils cmake ninja-build
      - name: llama.cpp
        run: scripts/build-llama.sh
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
